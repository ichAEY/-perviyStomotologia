name: One-time exact source transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-source-once.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import original Git blobs without modifying workflows yet
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/ichAEY/-dm_rihalsky.git main
          SOURCE_COMMIT="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_COMMIT" = "06a3c326140a849d587c8796a6ae6a540980a71c"
          SOURCE_TREE="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          test "$SOURCE_TREE" = "7ae91170b01fade767bd45790182efcd3d581551"
          TARGET_HEAD="$(git rev-parse HEAD)"
          git read-tree "$SOURCE_TREE"
          git restore --source=HEAD --staged -- .github/workflows
          STAGED_TREE="$(git write-tree)"
          test -z "$(git diff-tree -r --name-only "$TARGET_HEAD" "$STAGED_TREE" -- .github/workflows)"
          NEW_COMMIT="$(printf 'Import original site files without workflow edits\n' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$STAGED_TREE" -p "$TARGET_HEAD")"
          git push origin "$NEW_COMMIT:refs/heads/main"
          echo "Imported source Git objects; workflows still untouched."
